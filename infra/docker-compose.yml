services:
  db:
    image: postgres:16-alpine
    container_name: ticket_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticket_db}
      POSTGRES_USER: ${POSTGRES_USER:-ticket_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticket_pass}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ticket_user} -d ${POSTGRES_DB:-ticket_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile
    container_name: ticket_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: ${SECRET_KEY:-django-insecure-change-me-in-production}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_URL: postgres://${POSTGRES_USER:-ticket_user}:${POSTGRES_PASSWORD:-ticket_pass}@db:5432/${POSTGRES_DB:-ticket_db}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@ticket-system.local}
    depends_on:
      db:
        condition: service_healthy

  # SLA анхааруулга / escalation (15 мин) болон идэвхгүй ticket сануулга (60 мин)-г
  # автоматаар ажиллуулна — тусдаа cron тохируулах шаардлагагүй.
  scheduler:
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile
    container_name: ticket_scheduler
    restart: unless-stopped
    command: python manage.py run_scheduler
    volumes:
      - ../backend:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: ${SECRET_KEY:-django-insecure-change-me-in-production}
      DEBUG: ${DEBUG:-True}
      DATABASE_URL: postgres://${POSTGRES_USER:-ticket_user}:${POSTGRES_PASSWORD:-ticket_pass}@db:5432/${POSTGRES_DB:-ticket_db}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@ticket-system.local}
    depends_on:
      web:
        condition: service_started

volumes:
  postgres_data:
