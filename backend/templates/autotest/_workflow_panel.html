{% load i18n %}
<div class="offcanvas offcanvas-end" tabindex="-1" id="workflowPanel" aria-labelledby="workflowPanelTitle">
  <div class="offcanvas-header border-bottom">
    <h5 class="offcanvas-title" id="workflowPanelTitle"><i class="bi bi-diagram-3 text-primary"></i> Workflow · {{ flow.title }}</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="{% trans "Хаах" %}"></button>
  </div>
  <div class="offcanvas-body">
    <ol class="tms-flow tms-guide">
      {% for step in flow.steps %}
      <li class="tms-flow-step{% if step.current %} is-current{% endif %}{% if step.optional %} is-optional{% endif %}"{% if step.key %} data-guide="{{ step.key }}"{% endif %}>
        <span class="tms-flow-icon"><i class="bi {{ step.icon }}"></i></span>
        <div class="tms-flow-body">
          <div class="fw-semibold">{{ step.label }}</div>
          {% if step.desc %}<div class="small text-body-secondary">{{ step.desc }}</div>{% endif %}
          <div class="js-guide-example small mt-1{% if not step.example %} d-none{% endif %}"><span class="tms-flow-value">{{ step.example }}</span></div>
        </div>
      </li>
      {% endfor %}
    </ol>
  </div>
</div>
<script>
// Workflow самбар: сонгосон хуудас, "Хуудсыг шалгах"-ын үр дүнгээр жишээг шинэчилнэ; "Тестийн алхмууд" алхам тэр табыг нээнэ.
(function () {
  var panel = document.getElementById("workflowPanel");
  function example(key) { var li = panel.querySelector('[data-guide="' + key + '"]'); return li && li.querySelector(".js-guide-example"); }
  function chips(box, items) {
    box.innerHTML = "";
    items.forEach(function (item) {
      var chip = document.createElement("span");
      chip.className = "tms-chip " + (item[1] || "");
      chip.textContent = item[0];
      box.appendChild(chip);
    });
    box.classList.toggle("d-none", !items.length);
  }
  var pageSelect = document.querySelector("select[name=page]");
  if (pageSelect && example("page")) {
    pageSelect.addEventListener("change", function () {
      var opt = pageSelect.options[pageSelect.selectedIndex];
      chips(example("page"), opt && opt.value ? [[opt.text]] : []);
    });
  }
  document.addEventListener("autotest:scan", function (e) {
    var fields = (e.detail.fields || []).filter(function (f) { return f.label && f.in_main_form !== false; });
    if (example("fields")) chips(example("fields"), fields.map(function (f) { return [f.label]; }));
    if (!example("rows")) return;
    var rows = [["✓ {% trans "Бүх талбар зөв" %}", "ok"]];
    fields.forEach(function (f) { if (f.required) rows.push(["✗ " + f.label + " {% trans "хоосон" %}", "bad"]); });
    rows.push(["? {% trans "Хэт урт · SQL · XSS" %}"]);
    chips(example("rows"), rows);
  });
  var steps = panel.querySelector('[data-guide="steps"]');
  var stepsTab = document.querySelector('[data-bs-target="#tab-steps"]');
  if (steps && stepsTab) {
    steps.style.cursor = "pointer";
    steps.addEventListener("click", function () {
      bootstrap.Offcanvas.getOrCreateInstance(panel).hide();
      bootstrap.Tab.getOrCreateInstance(stepsTab).show();
    });
  }
})();
</script>
