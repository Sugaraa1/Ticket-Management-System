{% load i18n %}
{# Ангилал сонгоход "Дэд ангилал"-ыг шүүнэ; дэд ангилалгүй бол саарал/идэвхгүй болгоно. #}
{# Параметр: data — {category_id: [{id, name}]}, prefix — form-ийн auto_id угтвар ("id" / "qt"). #}
{{ data|json_script:json_id }}
<script>
document.addEventListener("DOMContentLoaded", function () {
  var dataEl = document.getElementById("{{ json_id }}");
  var category = document.getElementById("{{ prefix }}_category");
  var sub = document.getElementById("{{ prefix }}_subcategory");
  if (!dataEl || !category || !sub) return;
  var byCategory = JSON.parse(dataEl.textContent);
  var initial = sub.value;

  function refresh(preselect) {
    var items = byCategory[category.value] || [];
    sub.innerHTML = "";
    var empty = document.createElement("option");
    empty.value = "";
    empty.textContent = items.length ? "---------" : "{% trans "Дэд ангилал байхгүй" %}";
    sub.appendChild(empty);
    items.forEach(function (s) {
      var o = document.createElement("option");
      o.value = s.id;
      o.textContent = s.name;
      if (preselect && String(s.id) === String(preselect)) o.selected = true;
      sub.appendChild(o);
    });
    sub.disabled = items.length === 0;
  }

  category.addEventListener("change", function () { refresh(null); });
  refresh(initial);
});
</script>
